name: Go Test Workflow

on:
  push:
    branches:
      - master
      - release-**
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - master
      - release-**
env:
  TYK_IB_STORAGE_STORAGETYPE: file
  GO_VERSION: "1.26"

jobs:
  dep-guard:
    uses: TykTechnologies/github-actions/.github/workflows/dependency-guard.yml@production
    permissions:
      contents: read

  golangci-lint:
    needs: [dep-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Tyk Identity Broker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
      - name: Fetch base branch
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch origin ${{ github.base_ref }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        timeout-minutes: 20
        with:
          version: v2.12.2
          only-new-issues: ${{ github.event_name == 'pull_request' }}
          args: --issues-exit-code=0 -v ./...
          skip-cache: false
          skip-save-cache: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: golangcilint
          retention-days: 1
          path: |
            golangci-lint-report.json

  ci-test:
    needs: [dep-guard]
    name: "${{ matrix.databases }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        databases:
          - mongo-mgo
          - mongo-official
          - file
        redis-version: [5]
        mongodb-version: [4.2]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0 # zizmor: ignore[cache-poisoning] test/lint job; the cache was already on before this PR
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Dependencies and basic hygiene test
        id: hygiene
        run: |
          GOIMPORTS_VERSION=v0.33.0
          go install golang.org/x/tools/cmd/goimports@${GOIMPORTS_VERSION}

      - name: Start Redis
        uses: supercharge/redis-github-action@1f58ff85cf4f9ef3c036109c11acd8376b436b47  # 1.2.0
        with:
          redis-version: ${{ matrix.redis-version }}

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@751e4ddb1f8de2717b75f275abce04735664ef46  # 1.2.0
        with:
          mongodb-version: "${{ matrix.mongodb-version }}"

      - name: Run tests
        run: |
          ./bin/ci-tests.sh ${{ matrix.databases }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-${{ matrix.databases }}
          retention-days: 1
          path: |
            *cov
  sonar-cloud-analysis:
    runs-on: ubuntu-latest
    needs: [ci-test, golangci-lint]
    permissions:
      contents: read
    steps:
      - name: Checkout TIB
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
      - name: Fetch base branch
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch origin ${{ github.base_ref }}
      - name: Setup Golang
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0 # zizmor: ignore[cache-poisoning] test/lint job; the cache was already on before this PR
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Download golangcilint artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: golangcilint
      - name: Check reports existence
        id: check_files
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029  # v3.1.0
        with:
          files: 'golangci-lint-report.json'
          fail: true
      - name: Install Dependencies
        run: >
          go install github.com/wadey/gocovmerge@b5bfa59ec0adc420475f97f89b58045c721d761c

      - name: merge reports
        run: |
          ./bin/merge-cov.sh
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8  # v5.0.0
        with:
          args: >
            -Dsonar.organization=tyktechnologies
            -Dsonar.projectKey=TykTechnologies_tyk-identity-broker
            -Dsonar.sources=.
            -Dsonar.exclusions=ci/**
            -Dsonar.coverage.exclusions=**/*_test.go,**/mocks/*.go
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.tests=.
            -Dsonar.go.coverage.reportPaths=*.cov
            -Dsonar.go.golangci-lint.reportPaths=golangci-lint-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  aggregator-ci-test:
    name: Unit Tests & Linting
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [ ci-test ]
    steps:
      - name: Aggregate results
        run: |
          failed=()
          # Get the needs context as JSON once
          needs_json='${{ toJSON(needs) }}'

          # Loop through all jobs in the needs context
          for job in $(echo "$needs_json" | jq -r 'keys[]'); do
            job_result=$(echo "$needs_json" | jq -r --arg job "$job" '.[$job].result')

            if [[ "$job_result" != "success" ]]; then
              failed+=("$job")
            fi
          done

          if (( ${#failed[@]} )); then
            # Join the failed job names with commas
            failed_jobs=$(IFS=", "; echo "${failed[*]}")
            echo "❌ Failed jobs ----- : $failed_jobs"
            exit 1
          fi

          echo "✅ All required jobs succeeded"
